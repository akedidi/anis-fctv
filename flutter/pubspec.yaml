name: fctv33
description: FCTV33 multiplatform client (web, Android, Android TV, ios-flutter).
publish_to: "none"
version: 1.0.8+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  video_player: ^2.10.0
  collection: ^1.19.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/fctv_mark.png
