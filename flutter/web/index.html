<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FCTV33 — Live Sports">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FCTV">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>FCTV</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #10182B;
      color: #fff;
      font-family: "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .flutter-loader,
    .loading,
    flt-glass-pane + .flutter-loader {
      display: none !important;
    }
    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      background: linear-gradient(180deg, #1E2748 0%, #10182B 42%, #0B1220 100%);
      transition: opacity 160ms ease;
    }
    #app-boot.is-gone {
      opacity: 0;
      pointer-events: none;
    }
    #app-boot .pane {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    #app-boot .detail {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.35);
      font-size: 14px;
      font-weight: 600;
    }
    @media (min-width: 840px) {
      #app-boot .detail { display: flex; }
    }
    #app-boot .bar {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFAE01, transparent);
      background-size: 40% 100%;
      animation: bar 1.1s linear infinite;
    }
    #app-boot .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 16px 10px;
    }
    #app-boot .mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 19px;
      color: #000;
      background: linear-gradient(135deg, #FFAE01, #FF6B01);
    }
    #app-boot .brand { font-weight: 800; font-size: 20px; letter-spacing: 1.2px; }
    #app-boot .sub { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 2px; }
    #app-boot .tabs {
      display: flex;
      gap: 6px;
      padding: 6px 8px 10px;
    }
    #app-boot .tab {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
    }
    #app-boot .tab.on {
      background: rgba(255,174,1,0.22);
      color: #FFAE01;
    }
    #app-boot .search {
      margin: 4px 16px 10px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: rgba(255,255,255,0.35);
      font-size: 14px;
    }
    #app-boot .filters {
      display: flex;
      gap: 8px;
      padding: 0 16px 10px;
      align-items: center;
    }
    #app-boot .chip {
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
    }
    #app-boot .chip.on {
      background: #FFAE01;
      color: #000;
    }
    #app-boot .list {
      padding: 4px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    #app-boot .card {
      border-radius: 14px;
      background: rgba(29,32,41,0.92);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 12px;
    }
    #app-boot .row { display: flex; align-items: center; gap: 8px; }
    #app-boot .bone {
      background: rgba(255,255,255,0.07);
      border-radius: 6px;
      height: 10px;
    }
    #app-boot .dot {
      width: 18px; height: 18px; border-radius: 4px;
      background: rgba(255,255,255,0.07);
      flex: 0 0 auto;
    }
    #app-boot .logo {
      width: 22px; height: 22px; border-radius: 11px;
      background: rgba(255,255,255,0.07);
      flex: 0 0 auto;
    }
    #app-boot .time {
      width: 36px; height: 28px; border-radius: 8px;
      background: rgba(255,255,255,0.07);
      flex: 0 0 auto;
    }
    #app-boot .score {
      width: 28px; height: 14px; border-radius: 6px;
      background: rgba(255,255,255,0.1);
      flex: 0 0 auto;
      margin: 0 8px;
    }
    #app-boot .grow { flex: 1; }
    @keyframes bar {
      0% { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
    /* media_kit HtmlElementView: keep <video> visible under CanvasKit clips */
    flt-platform-view,
    flt-platform-view-slot,
    flt-glass-pane video,
    flutter-view video {
      clip-path: none !important;
    }
    flutter-view video,
    flt-platform-view video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="app-boot" aria-hidden="true">
    <div class="bar"></div>
    <div class="pane">
      <div class="top">
        <div class="mark">F</div>
        <div>
          <div class="brand">FCTV33</div>
          <div class="sub">Live Sports</div>
        </div>
      </div>
      <div class="tabs">
        <div class="tab">All</div>
        <div class="tab on">Football</div>
        <div class="tab">Basket</div>
        <div class="tab">Tennis</div>
        <div class="tab">More</div>
      </div>
      <div class="search">Search teams, leagues…</div>
      <div class="filters">
        <div class="chip on">All</div>
        <div class="chip">Live</div>
        <div class="chip">Finished</div>
      </div>
      <div class="list" id="boot-list"></div>
    </div>
    <div class="detail">Select a match</div>
  </div>
  <script>
    (function () {
      var list = document.getElementById('boot-list');
      if (list) {
        for (var i = 0; i < 8; i++) {
          list.innerHTML +=
            '<div class="card">' +
              '<div class="row">' +
                '<div class="dot"></div><div class="bone grow"></div><div class="bone" style="width:36px"></div>' +
              '</div>' +
              '<div class="row" style="margin-top:12px">' +
                '<div class="time"></div>' +
                '<div class="row grow"><div class="logo"></div><div class="bone grow"></div></div>' +
                '<div class="score"></div>' +
                '<div class="row grow"><div class="bone grow"></div><div class="logo"></div></div>' +
              '</div>' +
            '</div>';
        }
      }
      function dismissFctvBoot() {
        var el = document.getElementById('app-boot');
        if (!el || el.classList.contains('is-gone')) return;
        el.classList.add('is-gone');
        setTimeout(function () { el.remove(); }, 180);
      }
      window.dismissFctvBoot = dismissFctvBoot;
      // Fallback only — prefer Dart dismiss after the real shell paints.
      setTimeout(dismissFctvBoot, 15000);

      // Safari/CanvasKit: clip-path on flt-clip ancestors hides <video> (audio still plays).
      function stripClipAncestors(el) {
        var node = el;
        var hops = 0;
        while (node && hops < 14) {
          if (node.style) {
            node.style.removeProperty('clip-path');
            node.style.removeProperty('-webkit-clip-path');
          }
          node = node.parentElement;
          hops++;
        }
      }
      function clearVideoClipPaths(root) {
        if (!root) return;
        if (root.tagName === 'VIDEO') stripClipAncestors(root);
        var videos = root.querySelectorAll ? root.querySelectorAll('video') : [];
        for (var i = 0; i < videos.length; i++) stripClipAncestors(videos[i]);
      }
      new MutationObserver(function (mutations) {
        for (var m = 0; m < mutations.length; m++) {
          var mut = mutations[m];
          for (var n = 0; n < mut.addedNodes.length; n++) {
            var el = mut.addedNodes[n];
            if (el.nodeType === 1) clearVideoClipPaths(el);
          }
          if (mut.type === 'attributes' && mut.target && mut.target.nodeType === 1) {
            clearVideoClipPaths(mut.target);
          }
        }
      }).observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class'],
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    (function () {
      window._fctvHls = null;
      window.fctvDestroyHls = function () {
        if (window._fctvHls) {
          try { window._fctvHls.destroy(); } catch (e) {}
          window._fctvHls = null;
        }
      };
      window.fctvEnterFullscreen = function (video) {
        var root = (video && video.closest) ? video.closest('[data-fctv-player]') : null;
        var el = root || video || document.documentElement;
        try {
          if (el.requestFullscreen) return el.requestFullscreen();
          if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
          if (video && video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
            return Promise.resolve();
          }
        } catch (e) {}
        var docEl = document.documentElement;
        if (docEl.requestFullscreen) return docEl.requestFullscreen();
        if (docEl.webkitRequestFullscreen) return docEl.webkitRequestFullscreen();
        return Promise.reject(new Error('fullscreen unsupported'));
      };
      window.fctvExitFullscreen = function () {
        try {
          if (document.exitFullscreen && document.fullscreenElement) {
            return document.exitFullscreen();
          }
          if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
            return document.webkitExitFullscreen();
          }
        } catch (e) {}
        return Promise.resolve();
      };
      window.fctvIsFullscreen = function () {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      };

      window.fctvTogglePiP = function (video) {
        if (!video) return Promise.reject(new Error('no video'));
        try {
          if (video.webkitSetPresentationMode) {
            var mode = video.webkitPresentationMode === 'picture-in-picture'
              ? 'inline'
              : 'picture-in-picture';
            video.webkitSetPresentationMode(mode);
            return Promise.resolve(mode === 'picture-in-picture');
          }
          if (document.pictureInPictureElement === video) {
            return document.exitPictureInPicture().then(function () { return false; });
          }
          if (document.pictureInPictureEnabled !== false && video.requestPictureInPicture) {
            return video.requestPictureInPicture().then(function () { return true; });
          }
        } catch (e) {
          return Promise.reject(e);
        }
        return Promise.reject(new Error('pip unsupported'));
      };
      window.fctvIsPiP = function (video) {
        if (!video) return false;
        if (document.pictureInPictureElement === video) return true;
        if (video.webkitPresentationMode === 'picture-in-picture') return true;
        return false;
      };

      window.fctvAttachHls = function (video, url) {
        window.fctvDestroyHls();
        if (!video || !url) return Promise.resolve();
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        video.controls = false;
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.objectFit = 'contain';
        video.style.background = '#000';
        video.style.display = 'block';
        video.muted = false;
        video.volume = 1;
        function tryPlay() {
          // Prefer audible playback; fall back to muted only if the browser blocks it.
          video.muted = false;
          video.volume = 1;
          return video.play().catch(function () {
            video.muted = true;
            video._fctvPolicyMuted = true;
            return video.play().catch(function () { return null; });
          });
        }
        if (video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          return tryPlay();
        }
        if (window.Hls && window.Hls.isSupported()) {
          var hls = new window.Hls({
            enableWorker: true,
            lowLatencyMode: false,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 10,
            maxBufferLength: 30,
            backBufferLength: 30,
          });
          window._fctvHls = hls;
          return new Promise(function (resolve) {
            hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
              resolve(tryPlay());
            });
            hls.on(window.Hls.Events.ERROR, function (_e, data) {
              if (!data || !data.fatal) return;
              if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
              else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            });
            hls.loadSource(url);
            hls.attachMedia(video);
          });
        }
        video.src = url;
        return tryPlay();
      };

      /** Overlay controls inside the platform-view (keeps CanvasKit from blanking <video>). */
      window.fctvMountPlayer = function (root, opts) {
        opts = opts || {};
        root.setAttribute('data-fctv-player', '1');
        root.style.cssText =
          'position:relative;width:100%;height:100%;background:#000;overflow:hidden;user-select:none;';
        root.innerHTML = '';

        var video = document.createElement('video');
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        video.controls = false;
        video.autoplay = true;
        video.muted = opts && opts.muted === true;
        video.volume = 1;
        video.style.cssText =
          'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block;';

        var chrome = document.createElement('div');
        chrome.style.cssText =
          'position:absolute;inset:0;display:flex;flex-direction:column;opacity:1;transition:opacity .22s ease;z-index:2;';

        var dim = document.createElement('div');
        dim.style.cssText =
          'position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 28%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none;';

        var center = document.createElement('button');
        center.type = 'button';
        center.setAttribute('aria-label', 'Play');
        center.style.cssText =
          'margin:auto;width:64px;height:64px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;';
        center.textContent = '▶';

        var bar = document.createElement('div');
        bar.style.cssText =
          'position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;justify-content:flex-end;gap:4px;pointer-events:auto;';

        function mkBtn(label, aria) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', aria);
          b.textContent = label;
          b.style.cssText =
            'width:40px;height:40px;border:0;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;';
          return b;
        }

        var muteBtn = mkBtn('🔇', 'Mute');
        var pipBtn = mkBtn('⧉', 'Picture in picture');
        var fsBtn = mkBtn('⛶', 'Fullscreen');
        bar.appendChild(muteBtn);
        bar.appendChild(pipBtn);
        bar.appendChild(fsBtn);

        var spinner = document.createElement('div');
        spinner.style.cssText =
          'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;';
        spinner.innerHTML =
          '<div style="width:36px;height:36px;border:3px solid rgba(255,255,255,.25);border-top-color:#ffae01;border-radius:50%;animation:fctvspin .8s linear infinite"></div>';
        if (!document.getElementById('fctv-spin-style')) {
          var st = document.createElement('style');
          st.id = 'fctv-spin-style';
          st.textContent = '@keyframes fctvspin{to{transform:rotate(360deg)}}';
          document.head.appendChild(st);
        }

        chrome.appendChild(dim);
        chrome.appendChild(center);
        chrome.appendChild(bar);
        root.appendChild(video);
        root.appendChild(chrome);
        root.appendChild(spinner);

        var hideTimer = null;
        var chromeVisible = true;
        function setChrome(vis) {
          chromeVisible = vis;
          chrome.style.opacity = vis ? '1' : '0';
          chrome.style.pointerEvents = vis ? 'auto' : 'none';
          bar.style.pointerEvents = vis ? 'auto' : 'none';
          center.style.pointerEvents = vis ? 'auto' : 'none';
          center.style.display = vis || video.paused ? 'flex' : 'none';
        }
        function bumpHide() {
          clearTimeout(hideTimer);
          setChrome(true);
          if (!video.paused) {
            hideTimer = setTimeout(function () { setChrome(false); }, 3200);
          }
        }
        function syncUi() {
          center.textContent = video.paused ? '▶' : '❚❚';
          muteBtn.textContent = video.muted || video.volume === 0 ? '🔇' : '🔊';
          if (!video.paused && video.readyState >= 2) spinner.style.display = 'none';
          else if (video.readyState < 2) spinner.style.display = 'flex';
          center.style.display = chromeVisible || video.paused ? 'flex' : 'none';
        }

        center.addEventListener('click', function (e) {
          e.stopPropagation();
          if (video.paused) video.play().catch(function () {});
          else video.pause();
          bumpHide();
          syncUi();
        });
        muteBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          video.muted = !video.muted;
          video._fctvPolicyMuted = false;
          if (!video.muted) video.volume = 1;
          bumpHide();
          syncUi();
        });
        pipBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          window.fctvTogglePiP(video).catch(function () {});
          bumpHide();
        });
        fsBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (window.fctvIsFullscreen()) window.fctvExitFullscreen();
          else window.fctvEnterFullscreen(video);
          bumpHide();
        });

        root.addEventListener('pointermove', bumpHide);
        root.addEventListener('pointerdown', function (e) {
          // Restore sound only if autoplay policy forced mute (not user mute).
          if (video._fctvPolicyMuted && video.muted) {
            video.muted = false;
            video._fctvPolicyMuted = false;
            video.volume = 1;
            video.play().catch(function () {});
            syncUi();
          }
          if (e.target.closest('button')) return;
          if (!chromeVisible) {
            bumpHide();
            return;
          }
          // Tap empty area toggles play when chrome visible
          if (video.paused) video.play().catch(function () {});
          else bumpHide();
        });

        video.addEventListener('playing', function () {
          spinner.style.display = 'none';
          bumpHide();
          syncUi();
        });
        video.addEventListener('pause', function () {
          clearTimeout(hideTimer);
          setChrome(true);
          syncUi();
        });
        video.addEventListener('volumechange', syncUi);
        video.addEventListener('waiting', function () { spinner.style.display = 'flex'; });
        video.addEventListener('canplay', function () {
          if (!video.paused) spinner.style.display = 'none';
          syncUi();
        });
        document.addEventListener('fullscreenchange', syncUi);
        document.addEventListener('webkitfullscreenchange', syncUi);

        syncUi();
        bumpHide();
        return video;
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
