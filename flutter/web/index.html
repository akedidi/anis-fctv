<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FCTV33 — Live Sports">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FCTV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FCTV</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #10182B;
      color: #fff;
      font-family: "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .flutter-loader,
    .loading,
    flt-glass-pane + .flutter-loader {
      display: none !important;
    }
    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      background: linear-gradient(180deg, #1E2748 0%, #10182B 42%, #0B1220 100%);
      transition: opacity 160ms ease;
    }
    #app-boot.is-gone {
      opacity: 0;
      pointer-events: none;
    }
    #app-boot .pane {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    #app-boot .detail {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.35);
      font-size: 14px;
      font-weight: 600;
    }
    @media (min-width: 840px) {
      #app-boot .detail { display: flex; }
    }
    #app-boot .bar {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFAE01, transparent);
      background-size: 40% 100%;
      animation: bar 1.1s linear infinite;
    }
    #app-boot .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 16px 10px;
    }
    #app-boot .mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 19px;
      color: #000;
      background: linear-gradient(135deg, #FFAE01, #FF6B01);
    }
    #app-boot .brand { font-weight: 800; font-size: 20px; letter-spacing: 1.2px; }
    #app-boot .sub { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 2px; }
    #app-boot .tabs {
      display: flex;
      gap: 6px;
      padding: 6px 8px 10px;
    }
    #app-boot .tab {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
    }
    #app-boot .tab.on {
      background: rgba(255,174,1,0.22);
      color: #FFAE01;
    }
    #app-boot .search {
      margin: 4px 16px 10px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: rgba(255,255,255,0.35);
      font-size: 14px;
    }
    #app-boot .filters {
      display: flex;
      gap: 8px;
      padding: 0 16px 10px;
      align-items: center;
    }
    #app-boot .chip {
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
    }
    #app-boot .chip.on {
      background: #FFAE01;
      color: #000;
    }
    #app-boot .list {
      padding: 4px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    #app-boot .card {
      border-radius: 14px;
      background: rgba(29,32,41,0.92);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 12px;
    }
    #app-boot .row { display: flex; align-items: center; gap: 8px; }
    #app-boot .bone {
      background: rgba(255,255,255,0.07);
      border-radius: 6px;
      height: 10px;
    }
    #app-boot .dot {
      width: 18px; height: 18px; border-radius: 4px;
      background: rgba(255,255,255,0.07);
      flex: 0 0 auto;
    }
    #app-boot .logo {
      width: 22px; height: 22px; border-radius: 11px;
      background: rgba(255,255,255,0.07);
      flex: 0 0 auto;
    }
    #app-boot .time {
      width: 36px; height: 28px; border-radius: 8px;
      background: rgba(255,255,255,0.07);
      flex: 0 0 auto;
    }
    #app-boot .score {
      width: 28px; height: 14px; border-radius: 6px;
      background: rgba(255,255,255,0.1);
      flex: 0 0 auto;
      margin: 0 8px;
    }
    #app-boot .grow { flex: 1; }
    @keyframes bar {
      0% { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
  </style>
</head>
<body>
  <div id="app-boot" aria-hidden="true">
    <div class="bar"></div>
    <div class="pane">
      <div class="top">
        <div class="mark">F</div>
        <div>
          <div class="brand">FCTV33</div>
          <div class="sub">Live Sports</div>
        </div>
      </div>
      <div class="tabs">
        <div class="tab">All</div>
        <div class="tab on">Football</div>
        <div class="tab">Basket</div>
        <div class="tab">Tennis</div>
        <div class="tab">More</div>
      </div>
      <div class="search">Search teams, leagues…</div>
      <div class="filters">
        <div class="chip on">All</div>
        <div class="chip">Live</div>
        <div class="chip">Finished</div>
      </div>
      <div class="list" id="boot-list"></div>
    </div>
    <div class="detail">Select a match</div>
  </div>
  <script>
    (function () {
      var list = document.getElementById('boot-list');
      if (list) {
        for (var i = 0; i < 8; i++) {
          list.innerHTML +=
            '<div class="card">' +
              '<div class="row">' +
                '<div class="dot"></div><div class="bone grow"></div><div class="bone" style="width:36px"></div>' +
              '</div>' +
              '<div class="row" style="margin-top:12px">' +
                '<div class="time"></div>' +
                '<div class="row grow"><div class="logo"></div><div class="bone grow"></div></div>' +
                '<div class="score"></div>' +
                '<div class="row grow"><div class="bone grow"></div><div class="logo"></div></div>' +
              '</div>' +
            '</div>';
        }
      }
      function dismissFctvBoot() {
        var el = document.getElementById('app-boot');
        if (!el || el.classList.contains('is-gone')) return;
        el.classList.add('is-gone');
        setTimeout(function () { el.remove(); }, 180);
      }
      window.dismissFctvBoot = dismissFctvBoot;
      // Fallback only — prefer Dart dismiss after the real shell paints.
      setTimeout(dismissFctvBoot, 15000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
